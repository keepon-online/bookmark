name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支上只保留最新一次运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    # 钉住具体镜像：ubuntu-latest 将在 2026-11 切到 26.04，避免构建环境被无声换掉
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # 版本不在此指定：action 直接读 package.json 的 packageManager 字段，
        # 避免与显式 version 输入形成 "Multiple versions of pnpm specified" 冲突

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范
        run: pnpm lint

      - name: 单元测试
        run: pnpm test:run

      - name: 生产构建
        run: pnpm build

      - name: Firefox 生产构建
        run: pnpm build:firefox
