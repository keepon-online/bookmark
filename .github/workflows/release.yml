name: Release

on:
  push:
    tags:
      - 'v*'

# 发布流水线：tag v* 触发，双端构建打包并附到 GitHub Release。
# 与 ci.yml 相同的钉住策略：runner 镜像 / pnpm / node 大版本全部显式固定。
jobs:
  release:
    name: build & upload (chrome + firefox)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # 版本读 package.json 的 packageManager 字段（与 ci.yml 一致）

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范
        run: pnpm lint

      - name: 单元测试
        run: pnpm test:run

      - name: 打包双端产物
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: 校验产物
        run: |
          ls -la .output/*.zip
          # 只校验双端浏览器包；*-sources.zip 是 WXT 生成的 AMO 源码包，
          # 结构是源码树而非构建产物，不含根级 manifest.json，属正常
          for z in .output/smart-bookmark-*-chrome.zip .output/smart-bookmark-*-firefox.zip; do
            unzip -l "$z" | grep -q manifest.json || { echo "missing manifest.json in $z"; exit 1; }
          done

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .output/smart-bookmark-*-chrome.zip
            .output/smart-bookmark-*-firefox.zip
            .output/smart-bookmark-*-sources.zip
